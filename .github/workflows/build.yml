name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ziglang==0.16.0
      - name: Build x64
        run: TARGET=x86_64-windows-gnu ./build.sh && cp build/Wavesill.exe Wavesill-x64.exe
      - name: Build ARM64
        run: TARGET=aarch64-windows-gnu ./build.sh && cp build/Wavesill.exe Wavesill-arm64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Wavesill
          path: |
            Wavesill-x64.exe
            Wavesill-arm64.exe
            mod/wavesill-behind-taskbar-content.wh.cpp
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Wavesill-x64.exe
            Wavesill-arm64.exe
            mod/wavesill-behind-taskbar-content.wh.cpp
          generate_release_notes: true
